# Mizan EPM — local development stack.
# Postgres (with pgvector for RAG), Redis (cache/jobs), RabbitMQ (events),
# and Ollama (local/on-prem LLM so the platform runs with zero external AI keys).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan
      POSTGRES_DB: mizan_epm
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan -d mizan_epm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"] # amqp + management UI
    environment:
      RABBITMQ_DEFAULT_USER: mizan
      RABBITMQ_DEFAULT_PASS: mizan

  # Local LLM — enables enterprise private AI with no external provider.
  # Pull a model after start:  docker exec -it mizan-ollama ollama pull llama3.1
  ollama:
    image: ollama/ollama:latest
    container_name: mizan-ollama
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  ollamadata:
