<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mizan EPM — Enterprise Performance Management</title>
<style>
/* =====================================================================
   Mizan EPM — premium enterprise UI prototype (self-contained)
   Design system → app shell → module views. No external dependencies.
   ===================================================================== */

/* ---------- Tokens ---------- */
:root {
  --brand-1: #6366f1;   /* indigo   */
  --brand-2: #8b5cf6;   /* violet   */
  --brand-3: #22d3ee;   /* cyan     */
  --brand-grad: linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);

  /* dataviz-validated categorical + status */
  --c1:#3987e5; --c2:#199e70; --c3:#c98500; --c4:#9085e9; --c5:#e66767; --c6:#d55181;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 8px; --r: 14px; --r-lg: 20px;
  --sidebar-w: 264px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
html[data-theme="dark"] {
  --bg-0:#0a0a12; --bg-1:#0f1020; --surface:#14152a; --surface-2:#1a1c36;
  --elevated:#1f2140; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink-1:#f5f6ff; --ink-2:#b8bbe0; --ink-3:#7c7fa8;
  --glass:rgba(20,21,42,.72); --shadow:0 10px 40px -12px rgba(0,0,0,.6);
  --grid:rgba(255,255,255,.06);
}
html[data-theme="light"] {
  --bg-0:#eef0f7; --bg-1:#f4f5fb; --surface:#ffffff; --surface-2:#f7f8fd;
  --elevated:#ffffff; --line:rgba(15,16,40,.09); --line-2:rgba(15,16,40,.16);
  --ink-1:#12132b; --ink-2:#4a4d70; --ink-3:#8a8db0;
  --glass:rgba(255,255,255,.75); --shadow:0 12px 40px -14px rgba(30,32,80,.28);
  --grid:rgba(15,16,40,.07);
}

* { box-sizing:border-box; }
html,body { margin:0; padding:0; height:100%; }
body {
  font-family:var(--font); background:var(--bg-0); color:var(--ink-1);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
::selection { background:color-mix(in srgb,var(--brand-1) 40%,transparent); }
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:2px solid transparent;background-clip:content-box}
a{color:var(--brand-2);text-decoration:none}

/* ambient brand glow */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(600px 400px at 12% -5%,rgba(99,102,241,.16),transparent 60%),
    radial-gradient(700px 500px at 108% 8%,rgba(168,85,247,.14),transparent 60%);
}

/* ---------- App layout ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;transition:grid-template-columns .3s var(--ease)}
.app.collapsed{--sidebar-w:76px}

/* ---------- Sidebar ---------- */
.sidebar{background:var(--bg-1);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:18px 20px;height:64px;flex:0 0 auto}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--brand-grad);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 18px -6px rgba(99,102,241,.7);position:relative}
.brand .logo svg{width:20px;height:20px}
.brand .name{font-weight:750;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand .name span{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .plan{font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.app.collapsed .brand .txt{opacity:0;width:0}
.brand .txt{transition:opacity .2s}

.nav{flex:1;overflow-y:auto;padding:6px 12px 20px}
.nav .group{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:16px 12px 6px;white-space:nowrap}
.app.collapsed .nav .group{opacity:0;height:8px;padding:8px 0 0}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;position:relative;transition:background .15s,color .15s}
.nav a svg{width:18px;height:18px;flex:0 0 auto;opacity:.85}
.nav a:hover{background:var(--surface);color:var(--ink-1)}
.nav a.active{background:color-mix(in srgb,var(--brand-1) 16%,transparent);color:var(--ink-1)}
.nav a.active::before{content:"";position:absolute;inset-inline-start:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--brand-grad)}
.nav a .badge{margin-inline-start:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--brand-grad);color:#fff}
.app.collapsed .nav a .label,.app.collapsed .nav a .badge{opacity:0;width:0}

.side-foot{flex:0 0 auto;padding:12px;border-top:1px solid var(--line)}
.upsell{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.12));border:1px solid var(--line-2);border-radius:var(--r);padding:14px}
.upsell h4{margin:0 0 4px;font-size:12.5px}
.upsell p{margin:0 0 10px;font-size:11.5px;color:var(--ink-2)}
.app.collapsed .side-foot{display:none}

/* ---------- Topbar ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:64px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-1);cursor:pointer;display:grid;place-items:center;transition:.15s}
.iconbtn:hover{border-color:var(--line-2);background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.crumb{display:flex;flex-direction:column;line-height:1.2}
.crumb .path{font-size:11px;color:var(--ink-3);font-weight:600}
.crumb h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.search{margin-inline-start:auto;display:flex;align-items:center;gap:10px;width:min(340px,32vw);padding:0 14px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);cursor:pointer;transition:.15s}
.search:hover{border-color:var(--line-2)}
.search svg{width:16px;height:16px}
.search .kbd{margin-inline-start:auto;font:600 11px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:3px 6px}
.tenant{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 8px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:.15s}
.tenant:hover{border-color:var(--line-2)}
.tenant .av{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,#6366f1);display:grid;place-items:center;font-size:12px;font-weight:800;color:#04121a}
.tenant .tn{font-size:12.5px;font-weight:650;line-height:1.1}
.tenant .tn small{display:block;font-size:10px;color:var(--ink-3);font-weight:600}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;cursor:pointer;border:2px solid var(--line-2)}

/* ---------- Content ---------- */
.content{flex:1;overflow-y:auto;padding:26px 28px 60px;scroll-behavior:smooth}
.view{display:none;animation:fade .4s var(--ease)}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .lead h2{margin:0 0 4px;font-size:24px;font-weight:750;letter-spacing:-.03em}
.page-head .lead p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:60ch}
.head-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:650;padding:9px 15px;border-radius:11px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-1);transition:.15s}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand-grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px rgba(99,102,241,.7)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ai{background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(99,102,241,.2));border-color:var(--line-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.02em}
.pill.g{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.w{background:color-mix(in srgb,var(--warning) 20%,transparent);color:var(--warning)}
.pill.r{background:color-mix(in srgb,var(--critical) 20%,transparent);color:var(--critical)}
.pill.n{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* cards & grid */
.grid{display:grid;gap:18px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.col-2{grid-column:span 2}.col-3{grid-column:span 3}
@media(max-width:1200px){.g-4{grid-template-columns:repeat(2,1fr)}.col-3,.col-2{grid-column:span 2}}
@media(max-width:820px){.g-4,.g-3,.g-2{grid-template-columns:1fr}.col-3,.col-2{grid-column:span 1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;position:relative;transition:transform .25s var(--ease),border-color .25s}
.card.hover:hover{transform:translateY(-3px);border-color:var(--line-2)}
.card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:flex-start}
.card h3>svg{width:18px;height:18px;flex:0 0 auto;color:var(--brand-2)}
.card h3 .muted,.card h3 .pill{margin-inline-start:auto}
.card .muted{color:var(--ink-3);font-size:12px}
.card-sub{color:var(--ink-3);font-size:12px;margin:0 0 16px}

/* KPI tile */
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.stat .ic svg{width:20px;height:20px;color:#fff}
.stat .lbl{color:var(--ink-2);font-size:12.5px;font-weight:600;margin-top:14px}
.stat .val{font-size:34px;font-weight:760;letter-spacing:-.03em;margin:2px 0 0;line-height:1}
.stat .val small{font-size:15px;font-weight:650;color:var(--ink-2)}
.stat .delta{font-size:12.5px;font-weight:700;display:inline-flex;gap:5px;align-items:center;margin-top:8px}
.delta.up{color:var(--good)}.delta.down{color:var(--critical)}
.delta .vs{color:var(--ink-3);font-weight:500}

/* gauge / ring */
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring-legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin:6px 0}
.ring-legend i{width:10px;height:10px;border-radius:3px}
.ring-legend b{color:var(--ink-1);margin-inline-start:auto;font-variant-numeric:tabular-nums}

/* scorecard table */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:start;color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:0 12px 12px;border-bottom:1px solid var(--line)}
th.num,td.num{text-align:end;font-variant-numeric:tabular-nums}
tbody td{padding:13px 12px;border-bottom:1px solid var(--line);color:var(--ink-2)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.name{color:var(--ink-1);font-weight:600}
.trend-mini{width:78px;height:26px;vertical-align:middle}
.bar-track{height:7px;border-radius:6px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar-fill{height:100%;border-radius:6px;background:var(--brand-grad)}

/* strategy map */
.bsc{display:grid;gap:14px}
.persp{display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:stretch}
.persp .tag{border-radius:var(--r);padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.persp .tag h4{margin:0;font-size:15px;font-weight:750;padding-inline-end:48px}
.persp .tag p{margin:4px 0 0;font-size:11.5px;opacity:.9}
.persp .tag .pct{position:absolute;inset-inline-end:14px;top:12px;font-size:12px;font-weight:800;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:20px}
.persp .obj{display:flex;gap:12px;flex-wrap:wrap}
.objcard{flex:1;min-width:170px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;transition:.2s}
.objcard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.objcard .oh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.objcard .ot{font-size:12.5px;font-weight:650;color:var(--ink-1)}
.objcard .od{font-size:11px;color:var(--ink-3);margin-top:6px;display:flex;justify-content:space-between}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

/* heatmap */
.heat{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px}
.heat .cell{aspect-ratio:1.6/1;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0a0a12;position:relative;cursor:pointer;transition:.15s}
.heat .cell:hover{outline:2px solid var(--ink-1);z-index:2}
.heat .axis{display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink-3);text-align:center}
.heat .rlab{writing-mode:vertical-rl;transform:rotate(180deg)}
.risk-chip{position:absolute;font-size:9px;background:rgba(10,10,18,.72);color:#fff;padding:1px 5px;border-radius:20px;font-weight:700}

/* portfolio bubble legend row */
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-2)}.kv b{font-variant-numeric:tabular-nums}

/* OKR */
.okr{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;background:var(--surface)}
.okr .oh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.okr .obj-ic{width:34px;height:34px;border-radius:10px;background:var(--brand-grad);display:grid;place-items:center;color:#fff;font-weight:800}
.okr .obj-t{font-weight:700;font-size:14.5px}
.okr .obj-m{font-size:11.5px;color:var(--ink-3)}
.okr .score{margin-inline-start:auto;font-size:20px;font-weight:800}
.kr{display:grid;grid-template-columns:1fr 130px 54px;gap:14px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.kr .krt{font-size:12.5px;color:var(--ink-2)}
.kr .krp{font-size:12px;font-weight:700;text-align:end}

/* AI panel */
.ai-wrap{display:grid;grid-template-columns:1fr 340px;gap:18px}
@media(max-width:1000px){.ai-wrap{grid-template-columns:1fr}}
.chat{display:flex;flex-direction:column;height:min(600px,68vh)}
.chat .stream{flex:1;overflow-y:auto;padding:4px 4px 12px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;padding:13px 15px;border-radius:16px;font-size:13.5px;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--brand-grad);color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.a .who{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--brand-2);margin-bottom:8px}
.msg.a .who .spark{width:16px;height:16px}
.msg strong{color:var(--ink-1)}
.chat .composer{display:flex;gap:10px;margin-top:12px}
.chat .composer input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 15px;height:46px;color:var(--ink-1);font:inherit;font-size:13.5px;outline:none}
.chat .composer input:focus{border-color:var(--brand-1)}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.suggest button{font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:7px 12px;cursor:pointer;transition:.15s}
.suggest button:hover{border-color:var(--brand-1);color:var(--ink-1)}
.provider-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.provider-row:last-child{border-bottom:0}
.provider-row .pl{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600}
.provider-row .pdot{width:9px;height:9px;border-radius:50%}
.switch{width:38px;height:22px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-2);position:relative;cursor:pointer;transition:.2s}
.switch.on{background:var(--brand-1);border-color:transparent}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{inset-inline-start:18px}

/* command palette */
.cmdk{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(4,4,12,.55);backdrop-filter:blur(6px)}
.cmdk.open{display:flex;animation:fade .2s}
.cmdk .box{width:min(600px,92vw);background:var(--elevated);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.cmdk .in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmdk .in svg{width:18px;height:18px;color:var(--ink-3)}
.cmdk .in input{flex:1;background:none;border:0;outline:0;color:var(--ink-1);font:inherit;font-size:15px}
.cmdk .results{max-height:min(50vh,380px);overflow-y:auto;padding:8px}
.cmdk .res{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:13.5px}
.cmdk .res .ci{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.cmdk .res .ci svg{width:16px;height:16px;color:var(--brand-2)}
.cmdk .res small{color:var(--ink-3);margin-inline-start:auto;font-size:11px}
.cmdk .res.sel,.cmdk .res:hover{background:color-mix(in srgb,var(--brand-1) 16%,transparent)}
.cmdk .grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 12px 6px}

/* toast */
.toast{position:fixed;bottom:26px;inset-inline-end:26px;z-index:90;background:var(--elevated);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:13px;transform:translateY(140%);transition:transform .4s var(--ease);max-width:340px}
.toast.show{transform:none}
.toast .ti{width:34px;height:34px;border-radius:10px;background:var(--brand-grad);display:grid;place-items:center;flex:0 0 auto}

.tooltip{position:fixed;z-index:95;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--elevated);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow);min-width:120px}
.tooltip .tt{color:var(--ink-3);font-size:10.5px;margin-bottom:4px}
.tooltip .tr{display:flex;justify-content:space-between;gap:14px}.tooltip .tr b{font-variant-numeric:tabular-nums}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V6l8-3 8 3v14" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 20v-6h6v6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt">
        <div class="name">Mizan <span>EPM</span></div>
        <div class="plan">Enterprise · Gov Cloud</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="upsell">
        <h4>⚡ AI Copilot active</h4>
        <p>Claude Opus · 3 agents running · 1,204 insights this quarter</p>

function sparkline(data,color,w=78,h=26){

function donut(segments,size=150){
  const r=size/2-14,cx=size/2,cy=size/2,C=2*Math.PI*r;let off=0;

      "stroke-dasharray":`${len-3} ${C-len+3}`,"stroke-dashoffset":-off,transform:`rotate(-90 ${cx} ${cy})`});

  const dd=data.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(" ");

  lg.appendChild(svg("stop",{offset:"0%","stop-color":cv(color),"stop-opacity":.32}));lg.appendChild(svg("stop",{offset:"100%","stop-color":cv(color),"stop-opacity":0}));
  defs.appendChild(lg);el.appendChild(defs);
  el.appendChild(svg("path",{d:dd+` L${x(data.length-1)},${y(0)} L${x(0)},${y(0)} Z`,fill:`url(#${grad})`}));

  hit.addEventListener("mousemove",e=>{const r=el.getBoundingClientRect();let i=Math.round((( e.clientX-r.left)/r.width*W-m.l)/iw*(data.length-1));i=Math.max(0,Math.min(data.length-1,i));const d=data[i];dot.setAttribute("cx",x(i));dot.setAttribute("cy",y(d.v));dot.setAttribute("opacity",1);showTip(`<div class="tt">${d.t}</div><div class="tr"><span>${host.dataset.name||"Value"}</span><b>${fmtY(d.v)}</b></div>`,e);});

/* ---- KPI scorecard: shared row renderer + live API fetch ---- */
// Normalize the local demo KPIs to the same shape the API returns.
function normalizeStaticKpi(k){
  const attPct=Math.round((k.unit==='d'?k.target/k.actual:k.actual/k.target)*100);
  return {name:k.name,owner:k.owner,unit:k.unit,actual:k.actual,target:k.target,attPct,rag:k.status,trend:k.trend};
}
// Normalize an API KpiView (status = ON_TRACK/AT_RISK/… ; unit '%'|'d'|null).
function normalizeApiKpi(k){
  return {name:k.name,owner:k.owner||'—',unit:k.unit,actual:k.actual,target:k.target,
    attPct:k.attainmentPct,rag:RAG2CODE[k.status]||'n',trend:k.trend||[]};
}
function unitSuffix(u){return u==='%'?'%':u==='d'?'d':'';}
function kpiRows(items){
  return items.map(k=>{
    const col=k.rag==='g'?'--good':k.rag==='w'?'--warning':k.rag==='r'?'--critical':'--muted';
    const att=k.attPct==null?'—':k.attPct+'%';
    const barW=k.attPct==null?0:Math.min(100,k.attPct);
    const label=k.rag==='g'?'On target':k.rag==='w'?'At risk':k.rag==='r'?'Off track':'Not started';
    return `<tr><td class="name">${k.name}</td><td>${k.owner}</td>
      <td class="num" style="color:var(--ink-1);font-weight:700">${k.actual==null?'—':k.actual}${unitSuffix(k.unit)}</td>
      <td class="num">${k.target==null?'—':k.target}${unitSuffix(k.unit)}</td>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="bar-track"><div class="bar-fill" style="width:${barW}%;background:${cv(col)}"></div></div><span style="font-size:11.5px;font-weight:700;color:var(--ink-2)">${att}</span></div></td>
      <td>${k.trend&&k.trend.length?sparkline(k.trend,cv(col)):''}</td>
      <td><span class="pill ${k.rag}">${label}</span></td></tr>`;
  }).join("");
}
// Attempt to load live KPIs from the API; fall back silently to demo data.
async function loadLiveKpis(){
  const src=$("#kpiSource"),body=$("#kpiBody");
  if(!src||!body)return;
  try{
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),1500);
    const res=await fetch(`${API_BASE}/kpis/scorecard`,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok)throw new Error('http '+res.status);
    const sc=await res.json();
    body.innerHTML=kpiRows(sc.items.map(normalizeApiKpi));
    src.textContent=`Live API · overall ${sc.overallAttainmentPct}%`;
    src.className='pill g';
  }catch{
    src.textContent='Demo data (API offline)';
    src.className='pill n';
  }
}

    }
  }
  return cells;
}

const objStatus=s=>s==null?'NOT_STARTED':s>=70?'ON_TRACK':s>=40?'AT_RISK':'OFF_TRACK';
const meanProgress=objs=>{const v=objs.map(o=>o.progress).filter(p=>p!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;};
function bscHtml(perspectives){
  return perspectives.map(p=>{
    const score=p.score!=null?p.score:meanProgress(p.objectives);
    return `<div class="persp">
      <div class="tag" style="background:${p.color}"><span class="pct">${score==null?'—':score+'%'}</span><h4>${p.name}</h4><p>${p.desc||''}</p></div>
      <div class="obj">${p.objectives.map(o=>{const st=objStatus(o.progress);const col=st==='ON_TRACK'?'--good':st==='OFF_TRACK'?'--critical':st==='NOT_STARTED'?'--muted':'--warning';
        return `<div class="objcard" data-toast="Drilling into: ${o.title}"><div class="oh"><span class="ot">${o.title}</span><span class="dot" style="background:${cv(col)}"></span></div>
        <div class="od"><span>Attainment</span><span style="color:var(--ink-1);font-weight:700">${o.progress==null?'—':o.progress+'%'}</span></div></div>`}).join("")}</div>
    </div>`;
  }).join("");
}
function okrHtml(okrs){
  return okrs.map(o=>{const col=o.score>=70?'--good':o.score>=40?'--warning':'--critical';
    return `<div class="okr"><div class="oh"><div class="obj-ic">${icon("okr")}</div>
      <div><div class="obj-t">${o.objective}</div><div class="obj-m">Owner: ${o.owner||'—'} · ${o.keyResults.length} key results</div></div>
      <div class="score" style="color:${cv(col)}">${o.score==null?'—':o.score+'%'}</div></div>
      ${o.keyResults.map(k=>`<div class="kr"><div class="krt">${k.title}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${k.progress}%;background:${k.progress>=70?cv('--good'):k.progress>=40?cv('--warning'):cv('--critical')}"></div></div>
        <div class="krp">${k.progress}%</div></div>`).join("")}
    </div>`;
  }).join("");
}

  $$("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.nav===id));
  // per-view chart init
  if(id==="dash"){areaLine($("#perfChart"),perfSeries,"--c1");$("#invDonut").innerHTML=donut(PORTFOLIO.slice(0,4).map(p=>({v:p.budget,color:'--'+p.color})));}
  if(id==="portfolio"){renderBubble();$("#pfDonut").innerHTML=donut(PF_DATA.map(p=>({v:p.budget,color:'--'+p.color})),140);loadLivePortfolio();}
  if(id==="kpi"){loadLiveKpis();}
  if(id==="kri"){loadLiveRisks();}
  if(id==="strategy"){loadLiveStrategy();}
  if(id==="okr"){loadLiveOkrs();}
  if(id==="ai"){initChat();}
  wireToasts();
  $("#content").scrollTop=0;
}
function renderBubble(){
  const host=$("#bubble");if(!host)return;host.innerHTML="";
  const W=host.clientWidth||620,H=380,m={t:20,r:24,b:40,l:48},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const x=v=>m.l+v/10*iw, y=v=>m.t+ih-v/10*ih;
  const el=svg("svg",{width:"100%",height:H,viewBox:`0 0 ${W} ${H}`});
  for(let g=0;g<=5;g++){const gx=m.l+iw/5*g,gy=m.t+ih/5*g;
    el.appendChild(svg("line",{x1:gx,y1:m.t,x2:gx,y2:m.t+ih,stroke:cv("--grid")}));
    el.appendChild(svg("line",{x1:m.l,y1:gy,x2:m.l+iw,y2:gy,stroke:cv("--grid")}));}
  // quadrant highlight (top-left = best)
  el.appendChild(svg("rect",{x:m.l,y:m.t,width:iw/2,height:ih/2,fill:cv("--good"),opacity:.06}));
  const axx=svg("text",{x:m.l+iw/2,y:H-8,"text-anchor":"middle","font-size":11,fill:cv("--ink-3")});axx.textContent="Execution risk →";el.appendChild(axx);
  const axy=svg("text",{x:14,y:m.t+ih/2,"text-anchor":"middle","font-size":11,fill:cv("--ink-3"),transform:`rotate(-90 14 ${m.t+ih/2})`});axy.textContent="Strategic value →";el.appendChild(axy);
  PF_DATA.forEach(p=>{
    const r=8+p.budget/6;
    const c=svg("circle",{cx:x(p.risk),cy:y(p.value),r,fill:cv('--'+p.color),opacity:.82,stroke:cv("--surface"),"stroke-width":2,style:"cursor:pointer;transition:.15s"});
    c.addEventListener("mouseenter",e=>{c.setAttribute("opacity",1);showTip(`<div class="tt">${p.name}</div><div class="tr"><span>Value</span><b>${p.value}/10</b></div><div class="tr"><span>Risk</span><b>${p.risk}/10</b></div><div class="tr"><span>Budget</span><b>$${p.budget}M</b></div>`,e);});
    c.addEventListener("mousemove",e=>showTip(tip.innerHTML,e));
    c.addEventListener("mouseleave",()=>{c.setAttribute("opacity",.82);hideTip();});
    el.appendChild(c);
  });
  host.appendChild(el);
}

/* ---------- AI chat sim ---------- */
const CHAT_SUGGEST=["Why is digital adoption below target?","Forecast Q3 strategy execution","Which projects are most at risk?","Summarize portfolio for the board"];
const CHAT_ANSWERS={
  default:"Based on current enterprise data, I've analyzed the relevant KPIs, initiatives and risks. Overall performance is trending positive with two watch items. Ask me to drill into any perspective, forecast a metric, or draft a board-ready narrative.",
  "why is digital adoption below target?":"Digital adoption sits at <strong>78% vs an 85% target</strong>. Root-cause analysis points to three drivers: (1) low uptake among citizens over 55 (adoption 41%), (2) two flagship services still lack a mobile flow, and (3) awareness campaigns underspent by 22%. <strong>Recommendation:</strong> prioritize the mobile rollout for the two services and reallocate $2M contingency to targeted enablement — modelled to close ~5 pts of the gap by Q4.",
  "forecast q3 strategy execution":"Forecasting Q3 strategy execution using the last 12 months plus initiative velocity: expected <strong>89% (±2)</strong>, up from 87%. Main upside driver is the Digital ID rollout reaching go-live; main downside risk is the Smart City program schedule. Confidence: 78%.",
  "which projects are most at risk?":"Three projects carry high residual risk: <strong>Contact center modernization</strong> (31% progress, off-track, design delays), <strong>Smart City pilot Zone 3</strong> (budget at 104%), and <strong>Cloud migration wave 2</strong> (dependency on Data Fabric). I've drafted mitigation actions for each owner — want me to send them?",
  "summarize portfolio for the board":"<strong>Board summary:</strong> $227M across 6 programs. Portfolio is well-balanced — 4 of 6 sit in the high-value / lower-risk quadrant. The AI Center of Excellence and Digital Government Platform offer the best value-to-risk ratio. Watch item: Smart City (risk 6.2/10). Suggested decision: approve the next $18M tranche for the AI CoE and stage-gate the Smart City program pending schedule recovery.",
};
function bubbleMsg(txt,who){const d=document.createElement("div");d.className="msg "+who;
  d.innerHTML=who==="a"?`<div class="who">${icon("spark","spark")} Mizan Copilot · Claude Opus</div>${txt}`:txt;
  $("#chatStream").appendChild(d);$("#chatStream").scrollTop=1e9;return d;}
function initChat(){
  const s=$("#chatStream");s.innerHTML="";
  bubbleMsg("Good morning, Mohamed. I'm your enterprise performance copilot, grounded on live strategy, KPI, risk and portfolio data. What would you like to explore?","a");
  $("#suggest").innerHTML=CHAT_SUGGEST.map(q=>`<button>${q}</button>`).join("");
  $$("#suggest button").forEach(b=>b.onclick=()=>ask(b.textContent));
  $("#sendBtn").onclick=()=>ask($("#chatInput").value);
  $("#chatInput").onkeydown=e=>{if(e.key==="Enter")ask($("#chatInput").value);};
}
function ask(q){q=q.trim();if(!q)return;bubbleMsg(q,"u");$("#chatInput").value="";
  const thinking=bubbleMsg('<span style="color:var(--ink-3)">Analyzing enterprise data…</span>',"a");
  setTimeout(()=>{thinking.remove();bubbleMsg(CHAT_ANSWERS[q.toLowerCase()]||CHAT_ANSWERS.default,"a");},650);
}

/* ---------- command palette ---------- */
const CMDS=[
  ...NAV.flatMap(g=>g.items.map(i=>({t:i.label,s:i.path,ic:i.icon,act:()=>render(i.id)}))),
  {t:"Ask AI: forecast next quarter",s:"AI Copilot",ic:"spark",act:()=>{render("ai");setTimeout(()=>ask("Forecast Q3 strategy execution"),200);}},
  {t:"Generate board pack (PDF)",s:"Reports",ic:"download",act:()=>toast("Board pack generating…")},
  {t:"Toggle dark / light theme",s:"Preferences",ic:"bolt",act:toggleTheme},
  {t:"Switch to Arabic (RTL)",s:"Localization",ic:"strategy",act:toggleRTL},
];
let cmdSel=0,cmdFiltered=CMDS;
function openCmd(){$("#cmdk").classList.add("open");$("#cmdInput").value="";filterCmd("");$("#cmdInput").focus();}
function closeCmd(){$("#cmdk").classList.remove("open");}
function filterCmd(q){q=q.toLowerCase();cmdFiltered=CMDS.filter(c=>c.t.toLowerCase().includes(q)||c.s.toLowerCase().includes(q));cmdSel=0;drawCmd();}
function drawCmd(){$("#cmdResults").innerHTML=cmdFiltered.length?cmdFiltered.map((c,i)=>
  `<div class="res ${i===cmdSel?'sel':''}" data-i="${i}"><div class="ci">${icon(c.ic)}</div>${c.t}<small>${c.s}</small></div>`).join("")
  :`<div style="padding:24px;text-align:center;color:var(--ink-3)">No matches</div>`;
  $$("#cmdResults .res").forEach(r=>r.onclick=()=>{cmdFiltered[+r.dataset.i].act();closeCmd();});}

/* ---------- theme / rtl / toast ---------- */
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";render(currentView);}
function toggleRTL(){const h=document.documentElement;const rtl=h.dir==="rtl";h.dir=rtl?"ltr":"rtl";h.lang=rtl?"en":"ar";toast(rtl?"Switched to English (LTR)":"تم التبديل إلى العربية (RTL)");}
let toastT;
function toast(msg){$("#toastMsg").textContent=msg;$("#toast").classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>$("#toast").classList.remove("show"),2600);}
function wireToasts(){$$("[data-toast]").forEach(b=>{if(b.dataset.wired)return;b.dataset.wired=1;b.addEventListener("click",()=>{if(b.dataset.toast)toast(b.dataset.toast);});});}

/* ---------- boot + events ---------- */
buildNav();render("dash");
$("#nav").addEventListener("click",e=>{const a=e.target.closest("[data-nav]");if(a)render(a.dataset.nav);});
document.body.addEventListener("click",e=>{const n=e.target.closest("[data-nav]");if(n&&!n.closest("#nav"))render(n.dataset.nav);});
$("#burger").onclick=()=>$("#app").classList.toggle("collapsed");
$("#themeBtn").onclick=toggleTheme;
$("#rtlBtn").onclick=toggleRTL;
$("#searchBtn").onclick=openCmd;
$("#tenant").onclick=()=>toast("Tenant switcher — 12 organizations available.");
$("#cmdInput")?.addEventListener("input",e=>filterCmd(e.target.value));
addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#cmdk").classList.contains("open")?closeCmd():openCmd();}
  if(e.key==="Escape")closeCmd();
  if($("#cmdk").classList.contains("open")){
    if(e.key==="ArrowDown"){e.preventDefault();cmdSel=Math.min(cmdFiltered.length-1,cmdSel+1);drawCmd();}
    if(e.key==="ArrowUp"){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);drawCmd();}
    if(e.key==="Enter"&&cmdFiltered[cmdSel]){cmdFiltered[cmdSel].act();closeCmd();}
  }
});
$("#cmdk").addEventListener("click",e=>{if(e.target.id==="cmdk")closeCmd();});
addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>render(currentView),160);});
</script>
